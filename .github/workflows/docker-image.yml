name: Build and Publish Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve latest repository tag
        id: tag
        shell: bash
        run: |
          latest_tag="$(git tag --sort=-creatordate | head -n 1)"

          if [ -n "$latest_tag" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "value=$latest_tag" >> "$GITHUB_OUTPUT"
            echo "Latest repository tag: $latest_tag"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "No repository tag exists. The image will only be built."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tag.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.tag.outputs.exists == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/memoana-api:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
