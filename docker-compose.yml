services:
  memoana:
    image: ${DOCKER_REGISTRY-}memoana
    build:
      context: src/memoana
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    volumes:
      - memoana_data:/data:ro
volumes:
  memoana_data:
    driver: local